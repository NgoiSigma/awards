name: Recommend a problem
description: Recommend a mathematical problem or result with public sources.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem, its current status, and the supporting public evidence. A recommendation does not establish award eligibility.
        Do not include private contact details or payment information.
  - type: input
    id: problem
    attributes:
      label: Problem and original source
      description: Give its identifier and a public source link.
    validations:
      required: true
  - type: textarea
    id: significance
    attributes:
      label: Statement and significance
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Known results and verification evidence
      description: Include public references, immutable proof source if available, and unresolved priority questions. Do not upload large logs.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Related records and conflicts
      description: Link duplicates and state relevant public professional relationships, or write none.
    validations:
      required: true
