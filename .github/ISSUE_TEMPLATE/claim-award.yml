name: Claim an award
description: Apply for your own mathematical solution or Lean formalization contribution.
title: "[Award claim] JSP- "
body:
  - type: markdown
    attributes:
      value: |
        **Only the contributor may submit this claim. Do not apply or collect an award on someone else's behalf.**
        Your submitting GitHub account is the applicant account. Select both roles if you are claiming both contributions. Update an existing claim instead of submitting a duplicate.

        Apply after the relevant solution/proof PR has merged. Mathematical-solution-only applicants may leave the Lean repository blank; maintainers use the recorded source if one exists. A solver whose complete solution is accepted may also register a claim while formalization is missing. That application is retained without starting public review or permitting payment. Submit new proofs through the normal PR template. Raise candidate or award challenges, including priority objections, through the Formal dispute issue form and link any proposed replacement PR.

        When an accepted formalization source is available, each contribution type's 14-day public review starts when its candidate is added to the public register in candidates/ and public notice begins. The recorded public-notice start, not a PR merge time, determines the period. Claims and identity checks proceed alongside that review. A successful priority challenge replaces the affected candidate; that contribution type's new 14-day period starts when the replacement is added to candidates/ and its public notice begins. Before concluding public review, maintainers check pending PRs for the same problem and contribution type (mathematical solution or Lean formalization), regardless of submitter, and wait for reviews that could affect correctness, contribution attribution or priority. Final awards require the full review period, resolution of challenges and relevant pending PR reviews, and written recipient confirmation. See the [award process](https://github.com/TheJustinSunPrize/awards/blob/main/docs/award-process.md).

        Mathematical review remains required, but the two contribution types can be registered independently. Lean verification and candidate registration do not require the solver to have registered or claimed an award. A solver awaiting formalization can have an application record, but its 14-day review has not started.

        Use your GitHub account as your identity here. Send private identity materials, payment addresses and medal delivery addresses only by email to thejustinsunprize@hejustinsun.com. Official email comes only from @hejustinsun.com; we never ask for private keys or seed phrases.

        A submitted form or checked declaration is not identity verification or award approval.
  - type: input
    id: entry
    attributes:
      label: Problem link
      description: Provide the problem-bank link for the JSP identifier in the issue title.
      placeholder: https://github.com/TheJustinSunPrize/awards/blob/main/problems/catalog-0101-0200.md#JSP-000123
    validations:
      required: true
  - type: input
    id: submission_pr
    attributes:
      label: Merged submission PR
      description: Link the merged PR recording the contribution you are claiming. Include both PRs if your two roles were accepted separately.
      placeholder: https://github.com/TheJustinSunPrize/awards/pull/123
    validations:
      required: true
  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution being claimed
      description: Both contributions are reviewed separately, even when made by the same person.
      options:
        - Mathematical solution
        - Lean formalization
        - Both mathematical solution and Lean formalization
    validations:
      required: true
  - type: input
    id: lean_repository
    attributes:
      label: Original Lean proof repository
      description: Required for Lean formalization or Both claims; provide your own original repository already recorded as this problem's formalization source. Its owner must match your submitting account; mirrors or copies of another person's proof do not qualify. Optional for Mathematical solution only; leave blank or link the recorded source even if owned by someone else. Maintainers check the requirement for the selected role before approving a claim.
      placeholder: https://github.com/OWNER/REPOSITORY (solver-only applicants may leave blank)
    validations:
      required: false
  - type: input
    id: contact_email
    attributes:
      label: Follow-up contact email
      description: This address is public and will be used for follow-up; no extra comment is needed to designate it. All applicants must send an identity-verification email to thejustinsunprize@hejustinsun.com from this address after opening the claim issue, linking this issue and their merged PR. This address alone does not verify identity or authorship.
      placeholder: contact@example.org
    validations:
      required: true
  - type: textarea
    id: identity_verification
    attributes:
      label: Identity verification method
      description: Optional public note naming the method only; send the required identity-verification method and materials by email, not here. All applicants, including Lean-only and Both claims, must send an identity-verification email from the follow-up address above to thejustinsunprize@hejustinsun.com, linking the claim issue and merged PR. Existing source attribution does not waive this requirement. Methods include a paper-listed author mailbox, an established institutional or author website, a historical signing key, or another independently verifiable method. Use the email template in the award process. All recipients still require written confirmation before an award.
  - type: textarea
    id: attribution_clarification
    attributes:
      label: Identity or attribution clarification (if needed)
      description: Leave blank if the catalog already identifies your contribution clearly. Explain only what is needed to connect your applicant account to the credited contributor, such as bot commits or a shared project account. Link a correction issue or PR if the catalog needs updating. Do not repeat proof materials or post private identity information.
  - type: textarea
    id: related_claims
    attributes:
      label: Related claims, attribution questions and conflicts
      description: Link previous claims for this work and co-contributors' claims. Disclose overlapping claims, attribution disputes and relevant professional relationships. Update your existing claim instead of submitting a duplicate. Write None if there are no related claims or conflicts.
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Applicant declarations
      options:
        - label: The relevant contribution PR has merged. If I am a solver awaiting formalization, I understand that my application is retained without starting public review or permitting payment.
          required: true
        - label: I am applying for my own contribution using my own GitHub account, not applying or collecting on behalf of another person.
          required: true
        - label: My claim concerns my own contribution to the complete solution or Lean proof referenced in the identified problem-bank entry. I have identified any attribution discrepancies that need review.
          required: true
        - label: If claiming Lean formalization or Both, I have provided my original Lean proof repository URL above. For Mathematical solution only, this field may be blank.
          required: true
        - label: I understand that every applicant must send an identity-verification email from the follow-up address above to thejustinsunprize@hejustinsun.com after opening this issue, linking this issue and the merged PR, including for Lean-only claims with existing authorship evidence.
          required: true
        - label: I have disclosed related claims and attribution conflicts and will complete the maintainer's contribution and identity verification before claiming payment.
          required: true
